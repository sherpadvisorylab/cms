name: Publish packages to npm

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Publish packages
        run: |
          publish_if_new() {
            PKG_NAME=$(node -p "require('./package.json').name")
            PKG_VERSION=$(node -p "require('./package.json').version")
            PUBLISHED=$(npm view "$PKG_NAME@$PKG_VERSION" version 2>/dev/null || echo "")
            if [ -z "$PUBLISHED" ]; then
              echo "Publishing $PKG_NAME@$PKG_VERSION"
              npm publish --access public
            else
              echo "$PKG_NAME@$PKG_VERSION already published, skipping"
            fi
          }

          (cd packages/domain && publish_if_new)
          (cd packages/form-generator && publish_if_new)
          (cd packages/infrastructure && publish_if_new)
          (cd packages/cms && publish_if_new)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
